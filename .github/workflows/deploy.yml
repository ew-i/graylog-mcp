name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev --python 3.15

      - name: PEP 8 and static checks
        run: uv run ruff check --output-format=github src tests

      - name: Formatting
        run: uv run ruff format --check --diff src tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest --cov=src/graylog_mcp --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100

      - name: Make code coverage badge
        if: matrix.python-version == '3.15'
        run: |
          mkdir -p output
          uv run genbadge coverage -i coverage.xml -o output/coverage.svg

      - name: Publish coverage badge
        if: matrix.python-version == '3.15' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BADGE_TOKEN: ${{ secrets.BADGE_TOKEN }}
        run: |
          set -euo pipefail
          helper='!f() { echo "username=x-access-token"; echo "password=$BADGE_TOKEN"; }; f'
          git -c credential.helper="$helper" clone "https://github.com/ew-i/badges.git" badges
          mkdir -p badges/graylog-mcp
          cp output/coverage.svg badges/graylog-mcp/coverage.svg
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graylog-mcp/coverage.svg
          git commit -m "Update graylog-mcp coverage badge" || exit 0
          git -c credential.helper="$helper" push

  image-scan:
    name: Scan image (Trivy)
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t graylog-mcp:${{ github.sha }} .

      # pinned by SHA: trivy-action tags were hijacked in March 2026
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: graylog-mcp:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
