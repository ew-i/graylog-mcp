name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev --python 3.15

      - name: PEP 8 and static checks
        run: uv run ruff check --output-format=github src tests

      - name: Formatting
        run: uv run ruff format --check --diff src tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest --cov=src/graylog_mcp --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100

      - name: Make code coverage badge
        if: matrix.python-version == '3.15'
        run: |
          mkdir -p output
          uv run genbadge coverage -i coverage.xml -o output/coverage.svg

      - name: Publish coverage badge
        if: matrix.python-version == '3.15' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BADGE_TOKEN: ${{ secrets.BADGE_TOKEN }}
        run: |
          set -euo pipefail
          helper='!f() { echo "username=x-access-token"; echo "password=$BADGE_TOKEN"; }; f'
          git -c credential.helper="$helper" clone "https://github.com/ew-i/badges.git" badges
          mkdir -p badges/graylog-mcp
          cp output/coverage.svg badges/graylog-mcp/coverage.svg
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graylog-mcp/coverage.svg
          git commit -m "Update graylog-mcp coverage badge" || exit 0
          git -c credential.helper="$helper" push

  image-scan:
    name: Scan image (Trivy)
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t graylog-mcp:${{ github.sha }} .

      # pinned by SHA: trivy-action tags were hijacked in March 2026
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: graylog-mcp:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
